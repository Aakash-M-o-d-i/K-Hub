name: Deploy KnowledgeHub

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  APP_DIR: /var/www/knowledgehub

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd production_code/backend

          python -m pip install --upgrade pip

          pip install flake8
          pip install -r requirements.txt

      - name: Lint Check
        run: |
          cd production_code/backend

          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: production_code/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd production_code/frontend

          npm ci

      - name: Build Frontend
        run: |
          cd production_code/frontend

          echo "VITE_API_URL=/api" > .env.production

          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: production_code/frontend/dist
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - build-frontend

    if: github.ref == 'refs/heads/production'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          rsync -avz --delete \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='.env' \
            --exclude='.env.production' \
            --exclude='uploads/' \
            --exclude='*.sock' \
            -e "ssh -i ~/.ssh/deploy_key" \
            production_code/backend/ \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ env.APP_DIR }}/backend/

      - name: Clean Frontend Directory
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "rm -rf /var/www/knowledgehub/frontend/dist/*"

      - name: Deploy Frontend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend-dist/ \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ env.APP_DIR }}/frontend/dist/

      - name: Restart Backend Service
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'

            sudo systemctl restart knowledgehub

            sudo systemctl reload nginx

            sleep 5

            sudo systemctl status knowledgehub --no-pager

            if systemctl is-active --quiet knowledgehub; then
              echo "✅ Backend is running"
            else
              echo "❌ Backend failed"
              exit 1
            fi

          EOF
